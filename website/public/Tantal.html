<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Dragon · Tantal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Переменная теперь управляется из JS, но оставляем фолбэк */
      --master-color: #e6e6fa; 
    }

    body {
      background: #0a0a0a;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      user-select: none;
      overflow: hidden;
    }

    .card {
      max-width: 750px;
      width: 100%;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      cursor: default;
    }

    .title-wrapper {
      text-align: center;
    }

    .title-inner {
      display: inline-block;
      text-align: left;
      width: auto;
      position: relative;
    }

    .main-line {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: clamp(2rem, 5vw, 3.6rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #e6e6fa;
      display: block;
      padding-bottom: 6px;
      position: relative;
      z-index: 2;
    }

    .fire-line {
      width: 100%;
      height: 2px;
      margin-top: -2px;
      border-radius: 2px;
      opacity: 0.7;
      pointer-events: none;
      z-index: 1;
      position: relative;
      background: linear-gradient(to right,
        rgba(200, 200, 220, 0) 0%,
        rgba(200, 200, 220, 0) 30%,
        #aaaaee 45%,
        #ffffff 50%,
        #aaaaee 55%,
        rgba(200, 200, 220, 0) 70%,
        rgba(200, 200, 220, 0) 100%
      );
      background-size: 200% 100%;
      background-position: 50% 0;
      filter: drop-shadow(0 0 6px rgba(200, 200, 220, 0.5));
    }

    .second-line {
      display: block;
      text-align: right;
      margin-top: 0.3em;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      color: #e6e6fa;
      transition: color 0.3s;
      position: relative;
      z-index: 2;
      font-style: italic;
    }

    .tantal {
      font-weight: 700;
      font-style: normal;
      letter-spacing: 0.06em;
      color: var(--master-color);
      cursor: default;
      text-shadow: 
        0 0 15px color-mix(in srgb, var(--master-color) 60%, transparent),
        0 0 30px color-mix(in srgb, var(--master-color) 40%, transparent),
        0 0 45px color-mix(in srgb, var(--master-color) 20%, transparent),
        0 0 60px color-mix(in srgb, var(--master-color) 0%, transparent);
      will-change: text-shadow;
    }

    /* ===== СТИЛИ ДЛЯ GUI ПАНЕЛИ ===== */
    .debug-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #333;
      padding: 15px;
      border-radius: 8px;
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(5px);
      width: 270px;
      max-height: 95vh;
      overflow-y: auto;
    }
    .debug-panel label {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .debug-panel .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 5px;
      margin-bottom: 5px;
    }
    .debug-panel input[type="range"] {
      width: 100%;
    }
    .debug-panel select {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 4px;
      border-radius: 4px;
    }
    .debug-panel input[type="color"] {
      width: 100%;
      height: 30px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }
    .val-display {
      color: var(--master-color);
      font-weight: bold;
    }
    .debug-panel::-webkit-scrollbar { width: 6px; }
    .debug-panel::-webkit-scrollbar-track { background: #111; }
    .debug-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    
    .debug-copy-btn {
      margin-top: 10px;
      padding: 10px;
      background: var(--master-color);
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: filter 0.2s;
    }
    .debug-copy-btn:hover {
      filter: brightness(1.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title-wrapper">
      <div class="title-inner">
        <span class="main-line">BLACK DRAGON</span>
        <div class="fire-line"></div>
        <span class="second-line">Project <span class="tantal">Midas</span></span>
      </div>
    </div>
  </div>

  <script>
const CONFIG = {
  SHOW_GUI: true,
  MASTER_COLOR: '#e6e6fa',
  MODE: 4, 
  CONTINUOUS: true, 
  MAX_FIREFLIES: 50,
  SIZE_MIN: 0.2,
  SIZE_MAX: 0.8,
  GLOW_BLUR: 4,
  SPEED_BASE: 0.3,
  ACCEL_OUT: 1.5,
  ACCEL_IN: 0.5,
  DURATION_MIN: 4500,
  DURATION_MAX: 9500,
  ORBIT_DIST_MIN: 0,
  ORBIT_DIST_MAX: 15,
  ARC_AMPLITUDE: 27
};
    (function() {
      const tantal = document.querySelector('.tantal');
      if (!tantal) return;

      let GLOW_COLOR = CONFIG.MASTER_COLOR;
      // Устанавливаем цвет в CSS при инициализации
      document.documentElement.style.setProperty('--master-color', CONFIG.MASTER_COLOR);

      const FIREFLIES = [];

      if (CONFIG.SHOW_GUI) createDebugPanel();

      function forceUpdateGeometry() {
        FIREFLIES.forEach(ff => {
          const newTraj = generateTrajectory();
          if (newTraj) {
            ff.P0 = newTraj.P0;
            ff.P1 = newTraj.P1;
            ff.P2 = newTraj.P2;
          }
          ff.size = CONFIG.SIZE_MIN + Math.random() * (CONFIG.SIZE_MAX - CONFIG.SIZE_MIN);
          ff.duration = CONFIG.DURATION_MIN + Math.random() * (CONFIG.DURATION_MAX - CONFIG.DURATION_MIN);
        });
      }

      function createDebugPanel() {
        const panel = document.createElement('div');
        panel.className = 'debug-panel';

        panel.innerHTML = `
          <label>Мастер цвет: <span id="val-color" class="val-display" style="color: ${CONFIG.MASTER_COLOR}">${CONFIG.MASTER_COLOR}</span>
            <input type="color" id="gui-color" value="${CONFIG.MASTER_COLOR}">
          </label>
          <hr style="border: 0; border-top: 1px solid #444; margin: 5px 0;">
          <label>
            Режим (MODE):
            <select id="gui-mode">
              <option value="1" ${CONFIG.MODE === 1 ? 'selected' : ''}>1: Слово -> Слово</option>
              <option value="2" ${CONFIG.MODE === 2 ? 'selected' : ''}>2: Слово -> Орбита</option>
              <option value="3" ${CONFIG.MODE === 3 ? 'selected' : ''}>3: Орбита -> Слово</option>
              <option value="4" ${CONFIG.MODE === 4 ? 'selected' : ''}>4: Орбита -> Орбита</option>
            </select>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="gui-continuous" ${CONFIG.CONTINUOUS ? 'checked' : ''}>
            Непрерывный полет
          </label>
          <hr style="border: 0; border-top: 1px solid #444; margin: 5px 0;">
          <label>Частиц (MAX_FIREFLIES): <span id="val-max" class="val-display">${CONFIG.MAX_FIREFLIES}</span>
            <input type="range" id="gui-max" min="10" max="1500" step="10" value="${CONFIG.MAX_FIREFLIES}">
          </label>
          <label>Мин. размер: <span id="val-smin" class="val-display">${CONFIG.SIZE_MIN}</span>
            <input type="range" id="gui-smin" min="0.1" max="5" step="0.1" value="${CONFIG.SIZE_MIN}">
          </label>
          <label>Макс. размер: <span id="val-smax" class="val-display">${CONFIG.SIZE_MAX}</span>
            <input type="range" id="gui-smax" min="0.1" max="10" step="0.1" value="${CONFIG.SIZE_MAX}">
          </label>
          <label>Размытие (BLUR): <span id="val-blur" class="val-display">${CONFIG.GLOW_BLUR}</span>
            <input type="range" id="gui-blur" min="0" max="20" step="1" value="${CONFIG.GLOW_BLUR}">
          </label>
          <hr style="border: 0; border-top: 1px solid #444; margin: 5px 0;">
          <label>Скорость (SPEED): <span id="val-speed" class="val-display">${CONFIG.SPEED_BASE}</span>
            <input type="range" id="gui-speed" min="0.1" max="5" step="0.1" value="${CONFIG.SPEED_BASE}">
          </label>
          <label>Мин. время (мс): <span id="val-dmin" class="val-display">${CONFIG.DURATION_MIN}</span>
            <input type="range" id="gui-dmin" min="1000" max="20000" step="500" value="${CONFIG.DURATION_MIN}">
          </label>
          <label>Макс. время (мс): <span id="val-dmax" class="val-display">${CONFIG.DURATION_MAX}</span>
            <input type="range" id="gui-dmax" min="1000" max="20000" step="500" value="${CONFIG.DURATION_MAX}">
          </label>
          <label>Ускор. вылета: <span id="val-acc-out" class="val-display">${CONFIG.ACCEL_OUT}</span>
            <input type="range" id="gui-acc-out" min="0.1" max="5" step="0.1" value="${CONFIG.ACCEL_OUT}">
          </label>
          <label>Ускор. прилета: <span id="val-acc-in" class="val-display">${CONFIG.ACCEL_IN}</span>
            <input type="range" id="gui-acc-in" min="0.1" max="5" step="0.1" value="${CONFIG.ACCEL_IN}">
          </label>
          <hr style="border: 0; border-top: 1px solid #444; margin: 5px 0;">
          <label>Кривизна дуги: <span id="val-arc" class="val-display">${CONFIG.ARC_AMPLITUDE}</span>
            <input type="range" id="gui-arc" min="0" max="200" step="1" value="${CONFIG.ARC_AMPLITUDE}">
          </label>
          <label>Отступ МИН: <span id="val-dist-min" class="val-display">${CONFIG.ORBIT_DIST_MIN}</span>
            <input type="range" id="gui-dist-min" min="0" max="300" step="5" value="${CONFIG.ORBIT_DIST_MIN}">
          </label>
          <label>Отступ МАКС: <span id="val-dist-max" class="val-display">${CONFIG.ORBIT_DIST_MAX}</span>
            <input type="range" id="gui-dist-max" min="0" max="300" step="5" value="${CONFIG.ORBIT_DIST_MAX}">
          </label>
          <button class="debug-copy-btn" id="gui-copy">Скопировать CONFIG</button>
        `;
        document.body.appendChild(panel);

        // Обработчик изменения цвета
        document.getElementById('gui-color').addEventListener('input', (e) => {
          const newColor = e.target.value;
          CONFIG.MASTER_COLOR = newColor;
          document.getElementById('val-color').innerText = newColor;
          document.getElementById('val-color').style.color = newColor;
          document.documentElement.style.setProperty('--master-color', newColor);
          GLOW_COLOR = newColor;
        });

        const bindSync = (id, configKey, isInt = false, rebuildGeometry = false) => {
          document.getElementById(`gui-${id}`).addEventListener('input', (e) => {
            const val = isInt ? parseInt(e.target.value) : parseFloat(e.target.value);
            CONFIG[configKey] = val;
            document.getElementById(`val-${id}`).innerText = val;
            if (rebuildGeometry) forceUpdateGeometry();
          });
        };

        document.getElementById('gui-mode').addEventListener('change', (e) => { 
          CONFIG.MODE = parseInt(e.target.value); 
          forceUpdateGeometry();
        });
        
        document.getElementById('gui-continuous').addEventListener('change', (e) => { 
          CONFIG.CONTINUOUS = e.target.checked; 
        });

        bindSync('max', 'MAX_FIREFLIES', true, false);
        bindSync('blur', 'GLOW_BLUR', true, false);
        bindSync('speed', 'SPEED_BASE', false, false);
        bindSync('acc-out', 'ACCEL_OUT', false, false);
        bindSync('acc-in', 'ACCEL_IN', false, false);

        bindSync('smin', 'SIZE_MIN', false, true);
        bindSync('smax', 'SIZE_MAX', false, true);
        bindSync('dmin', 'DURATION_MIN', true, true);
        bindSync('dmax', 'DURATION_MAX', true, true);
        bindSync('arc', 'ARC_AMPLITUDE', true, true);
        bindSync('dist-min', 'ORBIT_DIST_MIN', true, true);
        bindSync('dist-max', 'ORBIT_DIST_MAX', true, true);

        document.getElementById('gui-copy').addEventListener('click', (e) => {
          const configStr = `const CONFIG = {
  SHOW_GUI: ${CONFIG.SHOW_GUI},
  MASTER_COLOR: '${CONFIG.MASTER_COLOR}',
  MODE: ${CONFIG.MODE}, 
  CONTINUOUS: ${CONFIG.CONTINUOUS}, 
  MAX_FIREFLIES: ${CONFIG.MAX_FIREFLIES},
  SIZE_MIN: ${CONFIG.SIZE_MIN},
  SIZE_MAX: ${CONFIG.SIZE_MAX},
  GLOW_BLUR: ${CONFIG.GLOW_BLUR},
  SPEED_BASE: ${CONFIG.SPEED_BASE},
  ACCEL_OUT: ${CONFIG.ACCEL_OUT},
  ACCEL_IN: ${CONFIG.ACCEL_IN},
  DURATION_MIN: ${CONFIG.DURATION_MIN},
  DURATION_MAX: ${CONFIG.DURATION_MAX},
  ORBIT_DIST_MIN: ${CONFIG.ORBIT_DIST_MIN},
  ORBIT_DIST_MAX: ${CONFIG.ORBIT_DIST_MAX},
  ARC_AMPLITUDE: ${CONFIG.ARC_AMPLITUDE}
};`;
          
          navigator.clipboard.writeText(configStr).then(() => {
            const btn = e.target;
            btn.innerText = 'СКОПИРОВАНО!';
            btn.style.background = '#fff';
            setTimeout(() => {
              btn.innerText = 'Скопировать CONFIG';
              btn.style.background = 'var(--master-color)';
            }, 1500);
          }).catch(err => {
            alert("Копирование заблокировано браузером (нужен https или localhost).");
            console.error("Clipboard error:", err);
          });
        });
      }

      const canvas = document.createElement('canvas');
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '10';
      document.body.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let width, height;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener('resize', resize);
      resize();

      let rect = tantal.getBoundingClientRect();
      function updateRect() {
        rect = tantal.getBoundingClientRect();
      }
      updateRect();

      function getWordPoint() {
        const margin = 2;
        return {
          x: rect.left + margin + Math.random() * (rect.width - 2 * margin),
          y: rect.top + margin + Math.random() * (rect.height - 2 * margin)
        };
      }

      function getOrbitPoint() {
        const minD = Math.min(CONFIG.ORBIT_DIST_MIN, CONFIG.ORBIT_DIST_MAX);
        const maxD = Math.max(CONFIG.ORBIT_DIST_MIN, CONFIG.ORBIT_DIST_MAX);
        
        const perimeter = (rect.width + rect.height) * 2;
        const p = Math.random() * perimeter;
        let baseX, baseY;

        if (p < rect.width) { 
          baseX = rect.left + p;
          baseY = rect.top;
        } else if (p < rect.width + rect.height) { 
          baseX = rect.right;
          baseY = rect.top + (p - rect.width);
        } else if (p < rect.width * 2 + rect.height) { 
          baseX = rect.right - (p - rect.width - rect.height);
          baseY = rect.bottom;
        } else { 
          baseX = rect.left;
          baseY = rect.bottom - (p - rect.width * 2 - rect.height);
        }

        const angle = Math.random() * Math.PI * 2;
        const dist = minD + Math.random() * (maxD - minD);
        
        return { 
          x: baseX + Math.cos(angle) * dist, 
          y: baseY + Math.sin(angle) * dist 
        };
      }

      function generateTrajectory(startPoint = null) {
        updateRect();
        if (rect.width === 0 || rect.height === 0) return null;

        let P0, P2;

        if (startPoint) {
          P0 = startPoint;
          if (CONFIG.MODE === 1 || CONFIG.MODE === 3) P2 = getWordPoint();
          else P2 = getOrbitPoint();
        } else {
          if (CONFIG.MODE === 1) { 
            P0 = getWordPoint(); P2 = getWordPoint();
          } else if (CONFIG.MODE === 2) { 
            P0 = getWordPoint(); P2 = getOrbitPoint();
          } else if (CONFIG.MODE === 3) { 
            P0 = getOrbitPoint(); P2 = getWordPoint();
          } else { 
            P0 = getOrbitPoint(); P2 = getOrbitPoint();
          }
        }

        const M = { x: (P0.x + P2.x) / 2, y: (P0.y + P2.y) / 2 };
        
        const randomAngle = Math.random() * Math.PI * 2;
        const offsetDist = (0.2 + Math.random() * 0.8) * CONFIG.ARC_AMPLITUDE;
        
        const P1 = {
          x: M.x + Math.cos(randomAngle) * offsetDist,
          y: M.y + Math.sin(randomAngle) * offsetDist
        };

        return { P0, P1, P2 };
      }

      function createFirefly(startPoint = null) {
        const traj = generateTrajectory(startPoint);
        if (!traj) return null;
        return {
          ...traj,
          t: startPoint ? 0 : Math.random(),
          duration: CONFIG.DURATION_MIN + Math.random() * (CONFIG.DURATION_MAX - CONFIG.DURATION_MIN),
          size: CONFIG.SIZE_MIN + Math.random() * (CONFIG.SIZE_MAX - CONFIG.SIZE_MIN)
        };
      }

      function updateFireflies(deltaMs) {
        while (FIREFLIES.length < CONFIG.MAX_FIREFLIES) {
          const ff = createFirefly();
          if (ff) FIREFLIES.push(ff);
        }
        if (FIREFLIES.length > CONFIG.MAX_FIREFLIES) {
          FIREFLIES.splice(CONFIG.MAX_FIREFLIES);
        }

        for (const ff of FIREFLIES) {
          const transitionFactor = (1 - Math.cos(ff.t * Math.PI)) / 2;
          const currentAccel = CONFIG.ACCEL_OUT * (1 - transitionFactor) + CONFIG.ACCEL_IN * transitionFactor;
          
          const speedMultiplier = CONFIG.SPEED_BASE * currentAccel;
          ff.t += (deltaMs / ff.duration) * speedMultiplier;

          if (ff.t > 1) {
            if (CONFIG.CONTINUOUS) {
              const nextTraj = generateTrajectory(ff.P2);
              if (nextTraj) {
                ff.P0 = nextTraj.P0;
                ff.P1 = nextTraj.P1;
                ff.P2 = nextTraj.P2;
                ff.t = 0;
              }
            } else {
              const newTraj = generateTrajectory();
              if (newTraj) {
                ff.P0 = newTraj.P0;
                ff.P1 = newTraj.P1;
                ff.P2 = newTraj.P2;
                ff.t = 0;
                ff.duration = CONFIG.DURATION_MIN + Math.random() * (CONFIG.DURATION_MAX - CONFIG.DURATION_MIN);
                ff.size = CONFIG.SIZE_MIN + Math.random() * (CONFIG.SIZE_MAX - CONFIG.SIZE_MIN);
              }
            }
          }
        }
      }

      function drawFireflies() {
        ctx.clearRect(0, 0, width, height);

        for (const ff of FIREFLIES) {
          const t = ff.t;
          const u = 1 - t;
          
          const x = u * u * ff.P0.x + 2 * u * t * ff.P1.x + t * t * ff.P2.x;
          const y = u * u * ff.P0.y + 2 * u * t * ff.P1.y + t * t * ff.P2.y;

          let alpha, currentSize;

          if (CONFIG.CONTINUOUS) {
            alpha = 0.8;
            currentSize = ff.size;
          } else {
            const sinVal = Math.sin(t * Math.PI);
            alpha = 0.4 + 0.4 * sinVal;
            const sizeFactor = 0.6 + 0.4 * sinVal;
            currentSize = ff.size * sizeFactor;
          }

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.shadowColor = GLOW_COLOR;
          ctx.shadowBlur = CONFIG.GLOW_BLUR;
          ctx.fillStyle = GLOW_COLOR;
          ctx.beginPath();
          ctx.arc(x, y, currentSize, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      let lastTime = performance.now();

      function animate(time) {
        const delta = time - lastTime;
        lastTime = time;

        updateFireflies(delta);
        drawFireflies();
        requestAnimationFrame(animate);
      }

      window.addEventListener('scroll', updateRect);
      window.addEventListener('resize', updateRect);

      requestAnimationFrame(animate);

    })();
  </script>

</body>
</html>
